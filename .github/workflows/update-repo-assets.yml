name: Deploy WordPress.org asset/readme changes
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - "readme.txt"
            - ".wordpress-org/**"

# Prevent concurrent asset deploys from stepping on each other.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    update:
        name: Update
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   name: Checkout Code
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    # Do not store git credentials in .git -> could be leaked/exposed by infected/malicious action.
                    persist-credentials: false

            -   name: WordPress.org plugin asset/readme update
                uses: wearerequired/action-wordpress-plugin-asset-update@cc639dd68b9857e2cfe4cfbd11d1cf4c340b4adf # copy-only
                env:
                    SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                    SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                    SLUG: sharable-password-protected-posts
