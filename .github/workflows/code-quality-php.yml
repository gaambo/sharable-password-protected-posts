name: PHP Code Quality

on:
    # Run on all relevant pushes and on all relevant pull requests.
    push:
        paths:
            - "**.php"
            - "composer.json"
            - "composer.lock"
            - "phpcs.xml"
            - "phpcs.xml.dist"
            - "phpstan.neon"
            - "phpstan.neon.dist"
            - "code-quality-php.yml"
    pull_request:
        paths:
            - "**.php"
            - "composer.json"
            - "composer.lock"
            - "phpcs.xml"
            - "phpcs.xml.dist"
            - "phpstan.neon"
            - "phpstan.neon.dist"
            - "code-quality-php.yml"
    # Allow manually triggering the workflow.
    workflow_dispatch:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        name: "Lint: PHP ${{ matrix.php_version }}"
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            matrix:
                php_version: ["8.1", "8.2", "8.3", "8.4"]
        steps:
            -   name: Checkout repository
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    # Do not store git credentials in .git -> could be leaked/exposed by infected/malicious action.
                    persist-credentials: false

            -   name: Check Code Quality
                uses: ./.github/actions/code-quality
                with:
                    php-version: ${{ matrix.php_version }}
