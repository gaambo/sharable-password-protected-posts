name: PR Automation

on:
    pull_request:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Build Plugin ZIP
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write # Required to post sticky comments on PRs
            contents: read
        steps:
            -   name: Checkout Code
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    # Do not store git credentials in .git -> could be leaked/exposed by infected/malicious action.
                    persist-credentials: false

            -   name: Build Plugin ZIP
                id: build-zip
                uses: ./.github/actions/build-plugin

            -   name: Upload Plugin ZIP (PR)
                id: upload-artifacts
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    archive: false
                    name: plugin.zip
                    path: ${{ steps.build-zip.outputs.zip-file }}

            # Post sticky comment with a link to the ZIP in the PR
            -   name: Add Sticky Comment
                uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
                with:
                    header: plugin-zip # Used to identify this sticky comment.
                    message: |
                        🎉 The plugin ZIP is ready for testing!
                        [Download the latest ZIP file](${{ steps.upload-artifacts.outputs.artifact-url }})
